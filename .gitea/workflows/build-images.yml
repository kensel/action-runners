name: Release runner images

# Gitea Actions version of .github/workflows/build-images.yml. When .gitea/workflows exists,
# Gitea reads it and ignores .github/workflows. Runs only on v* tags and pushes the same
# kensel/action-runners tags to Docker Hub.
#
# act_runner requirements: the job container needs the Docker CLI and the host's Docker socket.
# The default ubuntu-latest label images (gitea/runner-images, catthehacker/ubuntu:act-*) include
# the CLI. Mount the socket in act_runner's config.yaml:
#   container:
#     valid_volumes: ["/var/run/docker.sock"]
#     options: "-v /var/run/docker.sock:/var/run/docker.sock"
# Repository settings: secret DOCKERHUB_TOKEN; variable DOCKERHUB_USERNAME (kensel).
# If this repo is mirrored to both GitHub and Gitea, set variable PUSH_IMAGES=false on one side
# so the two don't race to push the same tags.

on:
  push:
    tags: ["v*"]

env:
  REPO: kensel/action-runners

jobs:
  publish:
    if: vars.PUSH_IMAGES != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'kensel' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf %s "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Build, smoke-test, push every image
        env:
          GIT_SHA: ${{ gitea.sha }}
        run: scripts/build.sh --all --test --push
      - name: Log out of Docker Hub
        if: always()
        run: docker logout || true
