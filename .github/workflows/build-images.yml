name: Release runner images

# Runs only when a v* tag is pushed (e.g. v2026.11.0). It builds every image under images/,
# smoke-tests it, and pushes kensel/action-runners:<name>-<TAG>, :<name>-<TAG>-<sha> and :<name>
# to Docker Hub (TAG comes from images/<name>/image.env).
#
# The Docker Hub credentials live in the "dockerhub" environment, which only v* tags may use:
#   secret   DOCKERHUB_TOKEN      Docker Hub access token, Read & Write
#   variable DOCKERHUB_USERNAME   kensel

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-images
  cancel-in-progress: false

env:
  REPO: kensel/action-runners

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        run: echo "images=$(ls images | jq -R . | jq -sc .)" | tee -a "$GITHUB_OUTPUT"

  publish:
    name: publish ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-latest
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, smoke-test, push
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE: ${{ matrix.image }}
        run: scripts/build.sh --test --push "$IMAGE"
